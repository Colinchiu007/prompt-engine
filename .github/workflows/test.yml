name: Tests

on:
  workflow_dispatch:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    # 评审 C1：job 级 15 分钟预算，罩住哨兵 step 的 10 分钟上限（全量 pytest ~4:50 + 哨兵 ~1 分钟 + 安装余量）
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ['3.11']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install git+https://github.com/Colinchiu007/shared-models.git
          pip install -e ".[all]"

      - name: Run unit tests
        run: |
          pytest tests/ -q --tb=short --ignore=tests/test_web_e2e.py --ignore=tests/test_qa_comprehensive.py --ignore=tests/test_infinity_features.py --ignore=tests/test_v010_engineering.py

      - name: Corpus 258 sentinel gate
        # Round3 P0-3：独立 step（258×evaluate ≈1 分钟；step 10 分钟上限在 job 15 分钟预算内有效）
        run: |
          python scripts/eval_corpus_258.py
        timeout-minutes: 10

      - name: Health check
        run: |
          nohup python -m uvicorn prompt_engine.api.rest:app --port 8000 --host 127.0.0.1 &
          sleep 5
          curl -f http://127.0.0.1:8000/health || exit 1
